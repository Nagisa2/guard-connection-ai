dataset:
  name: BIDMC
  sampling_rate: 125

signals:
  input: PPG
  target: ECG

preprocessing:
  mode: none
  bandpass:
    lowcut_hz: 0.5
    highcut_hz: 20.0
    filter_order: 4

segmentation:
  window_seconds: 10
  overlap: 0.5
  window_samples: 1250
  hop_samples: 625

stft:
  representation: magnitude
  sampling_rate: 125
  window: hann
  nperseg: 64
  noverlap: 32
  nfft: 64
  boundary: zeros
  padded: true

split:
  method: subject_wise
  train_subjects: []
  val_subjects: []
  test_subjects: []

seed: 42