[project]
name = "guard-connection-ai"
version = "0.1.0"
description = "PPG to ECG spectrogram reconstruction for GUARD Connection"
readme = "README.md"
authors = [
    { name = "Nagisa", email = "arukaumentare@gmail.com" }
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=2.0,<2.5",
    "pandas>=2.2,<3",
    "pillow>=10,<12",
    "pyyaml>=6,<7",
    "scikit-image>=0.23,<0.26",
    "scikit-learn>=1.4,<1.8",
    "scipy>=1.11,<1.16",
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "tqdm>=4.66,<5",
    "mlflow>=3,<4",
]

[project.scripts]
guard-connection-ai = "guard_connection_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]